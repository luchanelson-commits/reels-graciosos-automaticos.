name: Generar y publicar Reel gracioso

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generar-reel-publicacion
  cancel-in-progress: false

jobs:
  generar-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar FFmpeg y FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar código
        run: |
          python -m py_compile generar_reel.py
          python -m py_compile generar_reel_publicacion.py

      - name: Generar Reel corto y subir a Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python generar_reel_publicacion.py

      - name: Activar publicaciones de Facebook e Instagram
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_DISPATCH_TOKEN }}
          script: |
            const fs = require('fs');

            const videoUrl = fs.readFileSync(
              'video_url.txt', 'utf8'
            ).trim();

            if (!videoUrl.startsWith('https://')) {
              throw new Error('La URL del video no es válida.');
            }

            const caption = [
              '😂 ¡Ríete un rato y comparte la alegría!',
              '',
              'Si te sacó una sonrisa, comenta 😂 y etiqueta a esa persona que siempre te hace reír.',
              '',
              '#NelsonLucha #ReelsGraciosos #Humor #Risas'
            ].join('\n');

            const owner = 'luchanelson-commits';

            for (const repo of [
              'facebook_motivacion',
              'instagram_motivacion'
            ]) {
              console.log(`Activando publicación en ${repo}...`);

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'publicar_reel.yml',
                ref: 'main',
                inputs: {
                  video_url: videoUrl,
                  caption: caption
                }
              });

              console.log(`Flujo activado en ${repo}.`);
            }

      - name: Guardar video y URL como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: reel-gracioso-publicacion
          path: |
            reel_gracioso_publicacion.mp4
            video_url.txt
          if-no-files-found: error
          retention-days: 7
