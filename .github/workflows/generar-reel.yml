name: Generar Reel gracioso

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar FFmpeg y FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar Reel
        run: python generar_reel.py

      - name: Guardar Reel generado
        uses: actions/upload-artifact@v4
        with:
          name: reel-gracioso
          path: "*.mp4"
          if-no-files-found: error
          retention-days: 7
