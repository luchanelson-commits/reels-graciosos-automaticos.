name: Generar Reel gracioso

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reels-graciosos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar Reel
        run: python generar_reel.py

      - name: Guardar Reel para descargar
        uses: actions/upload-artifact@v4
        with:
          name: reel-gracioso
          path: salida/reel_gracioso.mp4
          if-no-files-found: error
          retention-days: 7
